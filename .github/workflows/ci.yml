name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Linux build and existing tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify release source manifest
        run: python tools/snapshot.py --verify .
      - name: Configure existing CMake project
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DPIANO_ROLL_CORE_BUILD_TESTS=ON -DPIANO_ROLL_CORE_BUILD_EXAMPLE=ON
      - name: Compile
        run: cmake --build build-ci --parallel 2
      - name: Run existing CTest tests
        run: ctest --test-dir build-ci --output-on-failure --no-tests=error --timeout 240
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-logs
          path: |
            build-ci/Testing/Temporary/
            build-ci/python-summary.json
          if-no-files-found: ignore
          retention-days: 7

  juce-ui:
    name: Linux shared JUCE UI tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libfreetype6-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libgl1-mesa-dev libglu1-mesa-dev xvfb xauth
      - name: Fetch JUCE 7.0.12
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Configure shared JUCE UI tests
        run: cmake -S juce/tests -B build-juce -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_SOURCE_DIR="$RUNNER_TEMP/JUCE"
      - name: Compile
        run: cmake --build build-juce --parallel 2
      - name: Run shared JUCE UI tests
        run: xvfb-run -a ctest --test-dir build-juce --output-on-failure --no-tests=error --timeout 240

  playback-sanitizers:
    name: Playback ASan and UBSan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check real playback implementation under sanitizers
        run: |
          mkdir -p work
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I include tests/PlaybackTests.cpp src/Playback.cpp -pthread -o work/playback-sanitized
          ASAN_OPTIONS=detect_leaks=1 work/playback-sanitized
